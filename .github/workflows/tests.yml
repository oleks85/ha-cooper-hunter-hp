name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install pytest-homeassistant-custom-component ruff
      - run: ruff check --line-length 120 --select E,F,W,B,UP --ignore E501 custom_components tests scripts
      - run: pytest -q
