# Generated by scripts/build_dashboard.py – requires Mushroom & ApexCharts (HACS)
title: Тепловий насос
views:
- title: Огляд
  path: overview
  icon: mdi:heat-pump
  type: sections
  max_columns: 4
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Стан
      heading_style: title
      icon: mdi:heat-pump
    - type: custom:mushroom-template-card
      primary: '{% set comp = states(''sensor.hp_compressor_frequency'') | int(0) %}

        {% if is_state(''binary_sensor.hp_fault'', ''on'') %}Аварія

        {% elif is_state(''switch.hp_power'', ''off'') %}Вимкнено

        {% elif is_state(''binary_sensor.hp_defrost_active'', ''on'') %}Розморожування

        {% elif is_state(''binary_sensor.hp_disinfection_active'', ''on'') %}Дезінфекція

        {% elif comp > 0 and is_state(''binary_sensor.hp_dhw_3_way_valve'', ''on'') %}Нагрів гарячої води

        {% elif comp > 0 and is_state(''sensor.hp_operating_state'', ''cooling'') %}Охолодження

        {% elif comp > 0 %}Опалення

        {% else %}Очікування{% endif %}'
      secondary: 'Режим: {{ state_translated(''select.hp_operating_mode'') }} · Компресор {{ states(''sensor.hp_compressor_frequency'')
        }} Гц · Вулиця {{ states(''sensor.hp_outdoor_temperature'') }} °C'
      icon: mdi:heat-pump
      icon_color: '{% set comp = states(''sensor.hp_compressor_frequency'') | int(0) %}

        {% if is_state(''binary_sensor.hp_fault'', ''on'') %}red

        {% elif is_state(''switch.hp_power'', ''off'') %}grey

        {% elif is_state(''binary_sensor.hp_defrost_active'', ''on'') %}light-blue

        {% elif comp > 0 and is_state(''binary_sensor.hp_dhw_3_way_valve'', ''on'') %}deep-orange

        {% elif comp > 0 and is_state(''sensor.hp_operating_state'', ''cooling'') %}blue

        {% elif comp > 0 %}orange

        {% else %}green{% endif %}'
      entity: switch.hp_power
      tap_action:
        action: more-info
      multiline_secondary: true
      fill_container: true
      grid_options:
        columns: 12
    - type: conditional
      conditions:
      - condition: state
        entity: binary_sensor.hp_fault
        state: 'on'
      card:
        type: markdown
        content: '## ⚠️ Аварія теплового насоса

          {% for f in state_attr(''sensor.hp_active_faults'', ''faults_uk'') or [] %}

          - **{{ f }}**

          {% endfor %}'
        card_mod:
          style: 'ha-card { border: 2px solid var(--error-color); }'
    - type: custom:mushroom-chips-card
      alignment: center
      grid_options:
        columns: 12
      chips:
      - type: template
        entity: sensor.hp_compressor_frequency
        icon: mdi:engine
        icon_color: '{{ ''orange'' if states(''sensor.hp_compressor_frequency'') | int(0) > 0 else ''disabled'' }}'
        content: '{{ states(''sensor.hp_compressor_frequency'') }} Гц'
        tap_action:
          action: more-info
      - type: template
        entity: binary_sensor.hp_main_circulation_pump
        icon: mdi:pump
        icon_color: '{{ ''blue'' if is_state(''binary_sensor.hp_main_circulation_pump'', ''on'') else ''disabled'' }}'
        content: Насос
        tap_action:
          action: more-info
      - type: template
        entity: binary_sensor.hp_water_flow_detected
        icon: mdi:waves-arrow-right
        icon_color: '{{ ''cyan'' if is_state(''binary_sensor.hp_water_flow_detected'', ''on'') else ''disabled'' }}'
        content: Протік
        tap_action:
          action: more-info
      - type: template
        entity: binary_sensor.hp_dhw_3_way_valve
        icon: mdi:valve
        icon_color: '{{ ''deep-orange'' if is_state(''binary_sensor.hp_dhw_3_way_valve'', ''on'') else ''disabled'' }}'
        content: Клапан ГВП
        tap_action:
          action: more-info
      - type: template
        entity: binary_sensor.hp_defrost_active
        icon: mdi:snowflake-melt
        icon_color: '{{ ''light-blue'' if is_state(''binary_sensor.hp_defrost_active'', ''on'') else ''disabled'' }}'
        content: Розморожування
        tap_action:
          action: more-info
      - type: template
        icon: mdi:heating-coil
        icon_color: '{{ ''red'' if is_state(''binary_sensor.hp_electric_heater_stage_1'', ''on'') or is_state(''binary_sensor.hp_electric_heater_stage_2'',
          ''on'') or is_state(''binary_sensor.hp_hydrobox_electric_heater'', ''on'') or is_state(''binary_sensor.hp_tank_electric_heater'',
          ''on'') else ''disabled'' }}'
        content: Тен
      - type: template
        entity: switch.hp_silent_mode
        icon: mdi:volume-off
        icon_color: '{{ ''purple'' if is_state(''switch.hp_silent_mode'', ''on'') else ''disabled'' }}'
        content: Тихий
        tap_action:
          action: more-info
    - type: tile
      entity: switch.hp_power
      vertical: false
      name: Живлення
      features:
      - type: toggle
      features_position: inline
    - type: tile
      entity: select.hp_operating_mode
      vertical: false
      name: Режим
      features:
      - type: select-options
      grid_options:
        columns: 12
    - type: tile
      entity: switch.hp_silent_mode
      vertical: false
      name: Тихий режим
      features:
      - type: toggle
      features_position: inline
    - type: tile
      entity: switch.hp_weather_compensation
      vertical: false
      name: Погодна крива
      features:
      - type: toggle
      features_position: inline
  - type: grid
    cards:
    - type: heading
      heading: Опалення
      heading_style: title
      icon: mdi:radiator
    - type: thermostat
      entity: climate.hp_heating
      name: Опалення / охолодження
      features:
      - type: climate-hvac-modes
        hvac_modes:
        - 'off'
        - heat
        - cool
    - type: tile
      entity: sensor.hp_water_outlet_temperature
      vertical: false
      name: Подача
    - type: tile
      entity: sensor.hp_water_inlet_temperature
      vertical: false
      name: Зворот
    - type: tile
      entity: sensor.hp_buffer_tank_temperature
      vertical: false
      name: Буферний бак
    - type: tile
      entity: sensor.hp_water_delta_t
      vertical: false
      name: ΔT подача−зворот
    - type: tile
      entity: sensor.hp_current_temperature_target
      vertical: false
      name: Активна ціль
    - type: tile
      entity: sensor.hp_outdoor_temperature
      vertical: false
      name: Вулиця
  - type: grid
    cards:
    - type: heading
      heading: Гаряча вода
      heading_style: title
      icon: mdi:water-boiler
    - type: thermostat
      entity: water_heater.hp_dhw
      name: Гаряча вода
      features:
      - type: water-heater-operation-modes
        operation_modes:
        - 'off'
        - heat_pump
    - type: tile
      entity: sensor.hp_dhw_tank_temperature
      vertical: false
      name: Бак ГВП
    - type: tile
      entity: binary_sensor.hp_dhw_3_way_valve
      vertical: false
      name: Клапан ГВП
    - type: tile
      entity: switch.hp_disinfection
      vertical: false
      name: Дезінфекція
      features:
      - type: toggle
      features_position: inline
    - type: tile
      entity: binary_sensor.hp_disinfection_active
      vertical: false
      name: Дезінфекція триває
  - type: grid
    cards:
    - type: heading
      heading: Енергія та ефективність
      heading_style: title
      icon: mdi:lightning-bolt
    - type: tile
      entity: sensor.hp_energy_consumption
      vertical: false
      name: Спожито всього (ТН)
    - type: custom:apexcharts-card
      header:
        show: true
        title: Спожита енергія по днях
      graph_span: 14d
      span:
        end: day
      apex_config:
        chart:
          height: 260
        legend:
          show: true
        plotOptions:
          bar:
            columnWidth: 70%
      yaxis:
      - min: 0
        decimals: 0
        apex_config:
          title:
            text: kWh
      series:
      - entity: sensor.hp_energy_consumption
        name: Електрика
        type: column
        color: '#fbc02d'
        statistics:
          type: change
          period: day
          align: start
        group_by:
          func: last
          duration: 1d
      grid_options:
        columns: 12
  - type: grid
    column_span: 3
    cards:
    - type: heading
      heading: Графіки
      heading_style: title
      icon: mdi:chart-line
    - type: custom:apexcharts-card
      header:
        show: true
        title: Температури та компресор (24 год)
        show_states: false
      graph_span: 24h
      apex_config:
        chart:
          height: 300
        legend:
          show: true
        stroke:
          width: 2
      yaxis:
      - id: t
        decimals: 0
        apex_config:
          title:
            text: °C
      - id: hz
        opposite: true
        min: 0
        max: 120
        decimals: 0
        apex_config:
          title:
            text: Гц
      series:
      - entity: sensor.hp_water_outlet_temperature
        name: Подача
        yaxis_id: t
        color: '#ff7043'
        group_by:
          func: avg
          duration: 5min
      - entity: sensor.hp_water_inlet_temperature
        name: Зворот
        yaxis_id: t
        color: '#42a5f5'
        group_by:
          func: avg
          duration: 5min
      - entity: sensor.hp_dhw_tank_temperature
        name: Бак ГВП
        yaxis_id: t
        color: '#e53935'
        group_by:
          func: avg
          duration: 5min
      - entity: sensor.hp_buffer_tank_temperature
        name: Буфер
        yaxis_id: t
        color: '#ab47bc'
        group_by:
          func: avg
          duration: 5min
      - entity: sensor.hp_outdoor_temperature
        name: Вулиця
        yaxis_id: t
        color: '#66bb6a'
        group_by:
          func: avg
          duration: 5min
      - entity: sensor.hp_compressor_frequency
        name: Компресор
        yaxis_id: hz
        type: area
        color: '#9e9e9e'
        opacity: 0.25
        group_by:
          func: avg
          duration: 5min
      grid_options:
        columns: full
- title: Налаштування
  path: settings
  icon: mdi:tune
  type: sections
  max_columns: 3
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Уставки
      heading_style: title
      icon: mdi:thermometer
    - type: entities
      entities:
      - entity: number.hp_heating_setpoint
        name: Уставка опалення
      - entity: number.hp_dhw_setpoint
        name: Уставка ГВП
      - entity: number.hp_cooling_setpoint
        name: Уставка охолодження
      - entity: number.hp_maximum_outlet_temperature
        name: Макс. температура подачі ТН
      state_color: true
  - type: grid
    cards:
    - type: heading
      heading: Погодозалежна крива
      heading_style: title
      icon: mdi:chart-bell-curve-cumulative
    - type: entities
      entities:
      - entity: switch.hp_weather_compensation
        name: Погодозалежне регулювання
      - entity: number.hp_curve_slope
        name: Нахил погодної кривої
      - entity: number.hp_curve_offset
        name: Зсув погодної кривої
      - type: attribute
        entity: climate.hp_heating
        attribute: heating_setpoint
        name: Поточна уставка опалення
        suffix: °C
      state_color: true
  - type: grid
    cards:
    - type: heading
      heading: Пріоритети та гістерезиси
      heading_style: title
      icon: mdi:swap-horizontal
    - type: entities
      entities:
      - entity: number.hp_forced_dhw_time
        name: Час перемикання режимів ГВП/опалення
      - entity: number.hp_heating_restart_delta
        name: Гістерезис опалення (увімкнення)
      - entity: number.hp_heating_standby_delta
        name: Гістерезис опалення (очікування)
      - entity: number.hp_dhw_restart_delta
        name: Гістерезис ГВП (увімкнення)
      - entity: number.hp_dhw_standby_delta
        name: Гістерезис ГВП (очікування)
      state_color: true
  - type: grid
    cards:
    - type: heading
      heading: Насоси
      heading_style: title
      icon: mdi:pump
    - type: entities
      entities:
      - entity: select.hp_circulation_pump_mode
        name: Режим основного насоса
      - entity: number.hp_main_pump_interval
        name: Інтервал насоса
      - entity: number.hp_main_pump_runtime
        name: Тривалість роботи насоса
      - entity: select.hp_dhw_pump_mode
        name: Режим насоса ГВП
      - entity: switch.hp_manual_water_pump
        name: Ручне керування насосом
      state_color: true
  - type: grid
    cards:
    - type: heading
      heading: Електротен
      heading_style: title
      icon: mdi:heating-coil
    - type: entities
      entities:
      - entity: select.hp_electric_heater_mode
        name: Розташування електротену
      - entity: number.hp_heater_on_ambient
        name: Вулична t° для дозволу тену
      - entity: number.hp_heater_delay
        name: Затримка тену після компресора
      state_color: true
  - type: grid
    cards:
    - type: heading
      heading: Дезінфекція
      heading_style: title
      icon: mdi:bacteria-outline
    - type: entities
      entities:
      - entity: switch.hp_disinfection
        name: Дезінфекція (легіонела)
      - entity: number.hp_disinfection_temperature
        name: Температура дезінфекції
      - entity: number.hp_disinfection_duration
        name: Тривалість дезінфекції
      - entity: number.hp_disinfection_start_hour
        name: Година початку дезінфекції
      - entity: number.hp_disinfection_interval
        name: Період дезінфекції
      state_color: true
  - type: grid
    cards:
    - type: heading
      heading: Сервіс
      heading_style: title
      icon: mdi:wrench
    - type: entities
      entities:
      - entity: switch.hp_silent_mode
        name: Тихий режим
      - entity: select.hp_temperature_control_source
        name: Датчик регулювання
    - type: tile
      entity: button.hp_manual_defrost
      name: Примусове розморожування
      icon: mdi:snowflake-melt
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.hp_manual_defrost
        confirmation:
          text: Запустити примусове розморожування теплового насоса?
- title: Діагностика
  path: diagnostics
  icon: mdi:stethoscope
  type: sections
  max_columns: 3
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Аварії
      heading_style: title
      icon: mdi:alert
    - type: conditional
      conditions:
      - condition: state
        entity: binary_sensor.hp_fault
        state: 'off'
      card:
        type: markdown
        content: ✅ **Аварій немає.** Усі захисти в нормі.
    - type: entity-filter
      conditions:
      - condition: state
        state: 'on'
      card:
        type: entities
        title: Активні аварії
      show_empty: false
      entities:
      - entity: binary_sensor.hp_ipm_overcurrent_fault
        name: Перевантаження IPM за струмом
      - entity: binary_sensor.hp_compressor_drive_fault
        name: Несправність драйвера компресора
      - entity: binary_sensor.hp_compressor_overcurrent
        name: Перевантаження компресора за струмом
      - entity: binary_sensor.hp_ac_phase_loss
        name: Втрата фази живлення
      - entity: binary_sensor.hp_ipm_sampling_fault
        name: Помилка вимірювання струму IPM
      - entity: binary_sensor.hp_drive_board_overheat
        name: Перегрів плати драйвера
      - entity: binary_sensor.hp_refrigerant_charge_fault
        name: Нестача холодоагенту
      - entity: binary_sensor.hp_dc_bus_overvoltage
        name: Перенапруга DC-шини
      - entity: binary_sensor.hp_dc_bus_undervoltage
        name: Низька напруга DC-шини
      - entity: binary_sensor.hp_ac_undervoltage
        name: Низька напруга живлення
      - entity: binary_sensor.hp_ac_overcurrent
        name: Перевантаження живлення за струмом
      - entity: binary_sensor.hp_ipm_overheat_protection
        name: Захист від перегріву IPM
      - entity: binary_sensor.hp_compressor_phase_loss
        name: Втрата фази компресора
      - entity: binary_sensor.hp_eeprom_fault
        name: Помилка EEPROM
      - entity: binary_sensor.hp_ac_overvoltage_protection
        name: Захист від перенапруги
      - entity: binary_sensor.hp_compressor_overspeed_protection
        name: Перевищення обертів компресора
      - entity: binary_sensor.hp_compressor_frequency_reduction_warning
        name: Обмеження частоти компресора
      - entity: binary_sensor.hp_weak_magnetic_field_warning
        name: 'Попередження: послаблення поля'
      - entity: binary_sensor.hp_power_module_overheat_warning
        name: 'Попередження: перегрів силового модуля'
      - entity: binary_sensor.hp_eeprom_warning
        name: Попередження EEPROM
      - entity: binary_sensor.hp_compressor_start_failure
        name: Невдалий пуск компресора
      - entity: binary_sensor.hp_heating_return_sensor_fault
        name: Несправність датчика звороту опалення
      - entity: binary_sensor.hp_heating_outlet_sensor_fault
        name: Несправність датчика подачі опалення
      - entity: binary_sensor.hp_high_pressure_protection
        name: Захист за високим тиском
      - entity: binary_sensor.hp_low_pressure_protection
        name: Захист за низьким тиском
      - entity: binary_sensor.hp_water_flow_protection
        name: Захист за протоком води
      - entity: binary_sensor.hp_electric_heater_overload_protection
        name: Перевантаження електротену
      - entity: binary_sensor.hp_freeze_protection_stage_1
        name: Захист від замерзання, ступінь 1
      - entity: binary_sensor.hp_freeze_protection_stage_2
        name: Захист від замерзання, ступінь 2
      - entity: binary_sensor.hp_system_freeze_protection
        name: Захист системи від замерзання
      - entity: binary_sensor.hp_room_temperature_sensor_fault
        name: Несправність кімнатного датчика
      - entity: binary_sensor.hp_discharge_overtemperature_protection
        name: Перегрів нагнітання
      - entity: binary_sensor.hp_fan_1_overload_limitation
        name: Перевантаження вентилятора 1
      - entity: binary_sensor.hp_fan_2_overload_limitation
        name: Перевантаження вентилятора 2
      - entity: binary_sensor.hp_excessive_water_delta_t_protection
        name: Завелика різниця температур води
      - entity: binary_sensor.hp_outlet_water_overtemperature_protection
        name: Перегрів води на подачі
      - entity: binary_sensor.hp_evaporator_outlet_sensor_fault
        name: Несправність датчика виходу випарника
      - entity: binary_sensor.hp_return_water_sensor_fault
        name: Несправність датчика звороту
      - entity: binary_sensor.hp_outlet_water_sensor_fault
        name: Несправність датчика подачі
      - entity: binary_sensor.hp_repeated_high_pressure_protection
        name: Повторний захист за високим тиском
      - entity: binary_sensor.hp_repeated_low_pressure_protection
        name: Повторний захист за низьким тиском
      - entity: binary_sensor.hp_repeated_water_flow_protection
        name: Повторний захист за протоком
      - entity: binary_sensor.hp_repeated_electric_heater_protection
        name: Повторний захист електротену
      - entity: binary_sensor.hp_repeated_freeze_protection
        name: Повторний захист від замерзання
      - entity: binary_sensor.hp_repeated_discharge_overtemperature
        name: Повторний перегрів нагнітання
      - entity: binary_sensor.hp_repeated_excessive_delta_t
        name: Повторна завелика різниця температур
      - entity: binary_sensor.hp_repeated_low_outlet_temperature
        name: Повторна низька температура подачі
      - entity: binary_sensor.hp_repeated_high_outlet_temperature
        name: Повторна висока температура подачі
      - entity: binary_sensor.hp_water_inlet_sensor_fault
        name: Несправність датчика входу води
      - entity: binary_sensor.hp_water_outlet_sensor_fault
        name: Несправність датчика виходу води
      - entity: binary_sensor.hp_heat_exchanger_sensor_fault
        name: Несправність датчика випарника
      - entity: binary_sensor.hp_outdoor_temperature_sensor_fault
        name: Несправність вуличного датчика
      - entity: binary_sensor.hp_return_air_sensor_fault
        name: Несправність датчика всмоктування
      - entity: binary_sensor.hp_anti_freeze_sensor_fault
        name: Несправність датчика антифризу
      - entity: binary_sensor.hp_heat_exchanger_outlet_sensor_fault
        name: Несправність датчика виходу теплообмінника
      - entity: binary_sensor.hp_evi_inlet_sensor_fault
        name: Несправність датчика входу EVI
      - entity: binary_sensor.hp_evi_outlet_sensor_fault
        name: Несправність датчика виходу EVI
      - entity: binary_sensor.hp_discharge_temperature_sensor_fault
        name: Несправність датчика нагнітання
    - type: entities
      entities:
      - entity: sensor.hp_active_faults
        name: Активні аварії
      - entity: binary_sensor.hp_alarm_output
        name: Вихід аварії
      - entity: binary_sensor.hp_emergency_input
        name: Аварійний вхід
      - entity: sensor.hp_firmware
        name: Прошивка контролера
  - type: grid
    cards:
    - type: heading
      heading: Холодильний контур
      heading_style: title
      icon: mdi:snowflake-thermometer
    - type: entities
      entities:
      - entity: sensor.hp_coil_temperature
        name: Температура випарника
      - entity: sensor.hp_suction_temperature
